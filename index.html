<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pneumatic Lottery Draw</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0d0f14;
    --panel:  #13161e;
    --chrome: #1e2330;
    --accent: #3a8fff;
    --amber:  #ffb330;
    --green:  #30e08a;
    --red:    #ff4455;
    --text:   #c8d4e8;
    --dim:    #5a6880;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 18px;
    padding: 20px;
    overflow-x: hidden;
    overflow-y: auto;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(22px, 4vw, 40px);
    letter-spacing: 0.12em;
    color: #fff;
    text-align: center;
  }
  h1 span { color: var(--accent); }

  /* ── Global control bar ── */
  #controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--chrome);
    border-radius: 12px;
    padding: 12px 16px;
  }
  #controls .btn-primary { width: auto; padding: 10px 22px; }
  #controls .btn-reset   { width: auto; padding: 9px 14px; }
  .air-control { display: flex; align-items: center; gap: 8px; }
  .air-label   { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
  .air-control .air-slider { width: 120px; }

  /* ── Workspace: a single horizontal row of canvases, with the shared
     results panel stacked below so the vases get the full width. ── */
  #workspace {
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: center;
    width: 100%;
    padding-top: 72px;   /* headroom for the captured-stage badge above canvases */
  }

  #stage {
    display: flex;
    gap: 14px;
    align-items: flex-end;   /* align vase bottoms when scaled */
    flex-wrap: nowrap;       /* keep all vases on one horizontal line */
    justify-content: center;
    width: 100%;
  }
  .canvas-wrap { position: relative; flex-shrink: 1; min-width: 0; }
  /* Scale every canvas to fit BOTH a share of the viewport width (so all five
     sit in one row) and the viewport height — never upscaling past native
     310×520. Aspect ratio is preserved, so each vase stays fully visible. */
  canvas { display: block; height: auto; width: auto; max-height: 54vh; max-width: 18vw; }

  #results {
    width: 100%;
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: stretch;
  }
  .res-row {
    width: 200px;
    background: var(--panel);
    border: 1px solid var(--chrome);
    border-radius: 12px;
    padding: 11px 13px;
  }
  .res-head { display: flex; align-items: center; gap: 8px; }
  .res-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: .08em;
    color: #fff; flex: 1;
  }
  .res-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px; line-height: 1;
    color: var(--amber);
    text-shadow: 0 0 18px rgba(255,179,48,0.5);
    margin-left: auto;
    transition: color .3s, text-shadow .3s;
  }
  .res-number.empty { color: var(--chrome); text-shadow: none; }
  .res-status {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: .04em;
    color: var(--dim);
    margin: 5px 0 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── History (horizontal, compact) ── */
  .history-list {
    display: flex;
    flex-direction: row;
    gap: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--chrome) transparent;
  }
  .history-list::-webkit-scrollbar { height: 4px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--chrome); border-radius: 2px; }
  .history-list:empty::after {
    content: 'No draws yet';
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--dim);
  }
  .hist-chip {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--chrome);
    color: #fff;
    border: 2px solid transparent;
    flex-shrink: 0;
    animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* ── Status dot ── */
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  .dot.active  { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.capture { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .dot.gate    { background: var(--red);   box-shadow: 0 0 8px var(--red); }

  /* ── Sliders ── */
  .slider-val  { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%; height: 4px;
    background: var(--chrome);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* ── Buttons ── */
  .btn-primary {
    width: 100%;
    padding: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: .1em;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, background .2s, opacity .2s;
  }
  .btn-primary:active:not(:disabled) { transform: translateY(1px); }
  .btn-primary:disabled { cursor: not-allowed; opacity: 0.38; }

  .btn-blow {
    background: linear-gradient(135deg, var(--accent), #1a5fcf);
    box-shadow: 0 4px 18px rgba(58,143,255,.35);
  }
  .btn-blow:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 26px rgba(58,143,255,.5); }

  .btn-gate {
    background: linear-gradient(135deg, #e05c00, #c03000);
    box-shadow: 0 4px 18px rgba(220,80,0,.3);
  }
  .btn-gate:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 26px rgba(220,80,0,.45); }
  .btn-gate.ready {
    background: linear-gradient(135deg, #e08800, #c05500);
    box-shadow: 0 4px 18px rgba(220,140,0,.4);
    animation: gatePulse 1s ease-in-out infinite;
  }
  @keyframes gatePulse {
    0%,100% { box-shadow: 0 4px 18px rgba(220,140,0,.4); }
    50%      { box-shadow: 0 4px 28px rgba(255,179,48,.75); }
  }

  .btn-reset {
    padding: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--chrome);
    border-radius: 8px;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .btn-reset:hover { color: var(--text); border-color: var(--dim); }

  /* ── Captured-ball badge (pops above its canvas) ── */
  .captured-stage {
    position: absolute;
    top: -72px;
    left: 50%;
    transform: translateX(-50%);
    width: 52px; height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<h1>PNEUMATIC <span>LOTTERY</span> DRAW</h1>

<div id="controls-host"></div>

<div id="workspace">
  <div id="stage"></div>
  <div id="results"></div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
