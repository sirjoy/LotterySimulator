<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pneumatic Lottery Draw</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0d0f14;
    --panel:  #13161e;
    --chrome: #1e2330;
    --accent: #3a8fff;
    --amber:  #ffb330;
    --green:  #30e08a;
    --red:    #ff4455;
    --text:   #c8d4e8;
    --dim:    #5a6880;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    overflow: hidden;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(22px, 4vw, 40px);
    letter-spacing: 0.12em;
    color: #fff;
    text-align: center;
  }
  h1 span { color: var(--accent); }

  /* #stage hosts one or more .sim-unit containers; CSS lays them out. */
  #stage {
    display: flex;
    gap: 40px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  .sim-unit {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .canvas-wrap { position: relative; flex-shrink: 0; }
  canvas { display: block; }

  .panel {
    width: 205px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--chrome);
    border-radius: 12px;
    padding: 14px;
  }
  .card-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 9px;
  }

  .result-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    line-height: 1;
    color: var(--amber);
    text-align: center;
    text-shadow: 0 0 28px rgba(255,179,48,0.5);
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color .3s, text-shadow .3s;
  }
  .result-number.empty { color: var(--chrome); text-shadow: none; }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 96px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--chrome) transparent;
  }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--chrome); border-radius: 2px; }
  .history-list:empty::after {
    content: 'No draws yet';
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--dim);
  }
  .hist-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .hist-idx {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--dim);
    width: 22px;
    text-align: right;
    flex-shrink: 0;
  }
  .hist-chip {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--chrome);
    color: #fff;
    border: 2px solid transparent;
    flex-shrink: 0;
    animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  .hist-bar {
    flex: 1;
    height: 2px;
    border-radius: 1px;
    opacity: 0.5;
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .status-bar {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .05em;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  .dot.active  { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.capture { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .dot.gate    { background: var(--red);   box-shadow: 0 0 8px var(--red); }

  .slider-wrap { display: flex; flex-direction: column; gap: 7px; }
  .slider-row  { display: flex; justify-content: space-between; align-items: center; }
  .slider-val  { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%; height: 4px;
    background: var(--chrome);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* Buttons */
  .btn-primary {
    width: 100%;
    padding: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: .1em;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, background .2s, opacity .2s;
  }
  .btn-primary:active:not(:disabled) { transform: translateY(1px); }
  .btn-primary:disabled { cursor: not-allowed; opacity: 0.38; }

  .btn-blow {
    background: linear-gradient(135deg, var(--accent), #1a5fcf);
    box-shadow: 0 4px 18px rgba(58,143,255,.35);
  }
  .btn-blow:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 26px rgba(58,143,255,.5); }

  .btn-gate {
    background: linear-gradient(135deg, #e05c00, #c03000);
    box-shadow: 0 4px 18px rgba(220,80,0,.3);
  }
  .btn-gate:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 26px rgba(220,80,0,.45); }
  .btn-gate.ready {
    background: linear-gradient(135deg, #e08800, #c05500);
    box-shadow: 0 4px 18px rgba(220,140,0,.4);
    animation: gatePulse 1s ease-in-out infinite;
  }
  @keyframes gatePulse {
    0%,100% { box-shadow: 0 4px 18px rgba(220,140,0,.4); }
    50%      { box-shadow: 0 4px 28px rgba(255,179,48,.75); }
  }

  .btn-reset {
    width: 100%;
    padding: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--chrome);
    border-radius: 8px;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .btn-reset:hover { color: var(--text); border-color: var(--dim); }

  .captured-stage {
    position: absolute;
    top: -72px;
    left: 50%;
    transform: translateX(-50%);
    width: 52px; height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<h1>PNEUMATIC <span>LOTTERY</span> DRAW</h1>

<div id="stage"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
